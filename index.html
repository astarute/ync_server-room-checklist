<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2a6b">
<title>서버실 점검</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="메뉴">☰</button>
  <div class="topbar-title">
    <img src="icons/logo-shield.png" alt="" class="topbar-logo">
    사이버보안
  </div>
</header>

<div class="layout">
<div id="drawerOverlay" class="drawer-overlay hidden"></div>
<nav id="drawer" class="drawer hidden" aria-label="메뉴">
  <div class="drawer-header">
    영남이공대학교
    <div class="drawer-sub">서버실 점검</div>
  </div>
  <button type="button" class="drawer-item" id="drawerHome">홈</button>

  <button type="button" class="drawer-item drawer-parent" id="drawerRoomsToggle">
    <span>강의실</span>
    <span class="drawer-caret" id="roomsCaret">▾</span>
  </button>
  <div id="roomsSubmenu" class="drawer-submenu hidden">
    <button type="button" class="drawer-subitem" data-room="멘토링 A">멘토링 A</button>
    <button type="button" class="drawer-subitem" data-room="멘토링 B">멘토링 B</button>
    <button type="button" class="drawer-subitem" data-room="해킹실습실">해킹실습실</button>
    <button type="button" class="drawer-subitem" data-room="보안관제실">보안관제실</button>
    <button type="button" class="drawer-subitem" data-room="클라우드 보안실">클라우드 보안실</button>
    <button type="button" class="drawer-subitem" data-room="정보보안실습실">정보보안실습실</button>
  </div>

  <button type="button" class="drawer-item" id="drawerServerRoom">서버실</button>
  <button type="button" class="drawer-item" id="drawerEquipRoom">장비실</button>
  <button type="button" class="drawer-item" id="drawerRecords">기록</button>
  <button type="button" class="drawer-item" id="drawerSettings">설정</button>
</nav>

<main id="app">

  <!-- 화면 1: 최초 로그인/등록 -->
  <section id="screen-onboard" class="screen hidden">
    <div class="card" id="onboardStep1">
      <div id="gsiButtonContainer" class="gsi-btn-wrap"></div>
      <p id="onboardLoginStatus" class="scan-status"></p>
    </div>

    <div class="card hidden" id="onboardStep2">
      <h1>거의 다 됐어요</h1>
      <p class="muted">로그인 확인됨: <strong id="onboardConfirmedName">-</strong> (<span id="onboardConfirmedEmail">-</span>)</p>
      <label class="field" id="onboardTeamAutoWrap">
        <span>직책</span>
        <input type="text" id="onboardTeamAuto" disabled>
      </label>
      <label class="field hidden" id="onboardTeamSelectWrap">
        <span>직책 선택</span>
        <select id="onboardTeamSelect">
          <option value="">선택해주세요</option>
          <option value="교수">교수</option>
          <option value="조교">조교</option>
          <option value="근로">근로</option>
          <option value="기타">기타</option>
        </select>
      </label>
      <button id="onboardSaveBtn" class="btn btn-primary btn-block">등록하고 시작하기</button>
    </div>
  </section>

  <!-- 화면 2: 메인 -->
  <section id="screen-home" class="screen hidden">
    <div class="card user-card">
      <div>
        <div class="muted small">현재 로그인</div>
        <div class="user-name" id="homeUserName">-</div>
      </div>
      <div class="now-clock" id="nowClock">--:--</div>
    </div>

    <div class="card">
      <div class="section-header">
        <h2>최근 점검 기록</h2>
        <button id="refreshBtn" class="icon-btn" aria-label="새로고침">
          <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12a8 8 0 0 1 14.5-4.6M20 12a8 8 0 0 1-14.5 4.6"/>
            <polyline points="18.5 3 18.5 8 13.5 8"/>
            <polyline points="5.5 21 5.5 16 10.5 16"/>
          </svg>
        </button>
      </div>
      <div id="historyList" class="history-list">
        <p class="muted small">기록을 불러오는 중...</p>
      </div>
    </div>
  </section>

  <!-- 화면 2-1: 서버실 (NFC 스캔 전용) -->
  <section id="screen-server" class="screen hidden">
    <div class="card scan-card">
      <h2>서버실 도착 확인</h2>
      <p class="muted">서버실 입구의 NFC 태그에 휴대폰을 가까이 대주세요. 태그를 인식하면 자동으로 시간과 이름이 기록됩니다.</p>
      <button id="scanBtn" class="btn btn-primary btn-block btn-large">
        <span class="btn-icon">📶</span> NFC 태그 스캔 시작
      </button>
      <button id="manualBtn" class="btn btn-ghost btn-block">NFC를 쓸 수 없나요? 수동으로 확인</button>
      <p id="scanStatus" class="scan-status"></p>
    </div>
  </section>

  <!-- 화면 2-2: 장비실 (NFC 스캔 전용, 서버실과 동일 구성) -->
  <section id="screen-equipment" class="screen hidden">
    <div class="card scan-card">
      <h2>장비실 도착 확인</h2>
      <p class="muted">장비실 입구의 NFC 태그에 휴대폰을 가까이 대주세요. 태그를 인식하면 자동으로 시간과 이름이 기록됩니다.</p>
      <button id="scanBtn2" class="btn btn-primary btn-block btn-large">
        <span class="btn-icon">📶</span> NFC 태그 스캔 시작
      </button>
      <button id="manualBtn2" class="btn btn-ghost btn-block">NFC를 쓸 수 없나요? 수동으로 확인</button>
      <p id="scanStatus2" class="scan-status"></p>
    </div>
  </section>

  <!-- 화면: 전체 기록 -->
  <section id="screen-records" class="screen hidden">
    <div class="card">
      <div class="section-header">
        <h1>전체 기록</h1>
        <button id="recordsBackBtn" class="icon-btn" aria-label="닫기">✕</button>
      </div>

      <div class="records-filters">
        <div class="filters-row">
          <select id="recPlaceFilter">
            <option value="">장소 전체</option>
          </select>
          <input type="date" id="recDateFilter">
        </div>
        <div class="filters-row chips-row">
          <button type="button" class="chip active" data-filter="all">전체</button>
          <button type="button" class="chip" data-filter="anomaly">⚠ 이상만</button>
          <button type="button" class="chip" data-filter="nfc">NFC만</button>
        </div>
      </div>
    </div>

    <div id="recordsList"></div>

    <button id="recordsMoreBtn" class="btn btn-ghost btn-block hidden">더 보기</button>
  </section>

  <!-- 화면 3: 체크리스트 입력 -->
  <section id="screen-checklist" class="screen hidden">
    <form id="checklistForm" class="card">
      <h2>점검 항목</h2>

      <label class="field">
        <span>온도 (°C) <span class="req">필수</span></span>
        <input type="number" step="0.1" id="fTemp" inputmode="decimal" placeholder="예: 22.5" required>
      </label>

      <fieldset class="field">
        <legend>장비 상태 점검</legend>
        <label class="checkbox-row">
          <input type="checkbox" id="eqAircon" checked>
          <span>항온항습기/에어컨 정상 가동</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="eqNoise" checked>
          <span>이상 소음/냄새 없음</span>
        </label>
      </fieldset>

      <label class="field">
        <span>이상 사항 메모 <span class="opt">선택</span></span>
        <textarea id="fNote" rows="3" placeholder="이상이 있다면 자세히 적어주세요"></textarea>
      </label>

      <label class="field">
        <span>사진 첨부 <span class="opt">선택, 이상 발생 시 권장</span></span>
        <input type="file" id="fPhoto" accept="image/*" capture="environment">
        <img id="photoPreview" class="photo-preview hidden" alt="첨부 사진 미리보기">
      </label>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-large">점검 결과 제출</button>
      <button type="button" id="cancelBtn" class="btn btn-ghost btn-block">취소</button>
      <p id="submitStatus" class="scan-status"></p>
    </form>
  </section>

  <!-- 화면 4: 완료 -->
  <section id="screen-done" class="screen hidden">
    <div class="card done-card">
      <div class="done-icon">✅</div>
      <h1>제출 완료</h1>
      <p class="muted">점검 기록이 저장되었습니다.</p>
      <button id="doneHomeBtn" class="btn btn-primary btn-block">확인</button>
    </div>
  </section>

  <!-- 설정 -->
  <section id="screen-settings" class="screen hidden">
    <div class="card">
      <h1>설정</h1>
      <label class="field">
        <span>이름 (Google 계정)</span>
        <input type="text" id="setName" disabled>
      </label>
      <label class="field">
        <span>이메일</span>
        <input type="text" id="setEmail" disabled>
      </label>
      <label class="field">
        <span>직책</span>
        <input type="text" id="setTeam">
      </label>
      <button id="setSaveBtn" class="btn btn-primary btn-block">저장</button>
      <button id="setLogoutBtn" class="btn btn-ghost btn-block">로그아웃</button>
      <button id="setBackBtn" class="btn btn-ghost btn-block">뒤로</button>
    </div>
  </section>

</main>

</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
